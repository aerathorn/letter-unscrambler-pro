<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Unscrambler Pro | Scrabble Solver & Wordle Cheat Suite</title>
    <!-- Stable Tailwind CSS Engine CDN -->
    <script src="https://tailwindcss.com"></script>
    <style>
        .word-tile {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- AD DEMARCATION SLOT (TOP) -->
    <div class="w-full max-w-7xl mx-auto my-4 text-center">
        <div class="bg-slate-200 text-slate-500 py-3 text-xs tracking-wider border border-dashed border-slate-300 rounded-md">ADVERTISEMENT SLOT (TOP)</div>
    </div>

    <!-- Application Dashboard Wrapper -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- Branding Panel -->
            <div class="bg-slate-900 text-white p-6 md:p-8 text-center">
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">Letter Unscrambler Pro</h1>
                <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">Elite multi-dictionary analytics engine for Scrabble, Words with Friends, and Wordle.</p>
            </div>

            <!-- Parameters Submission Input Interface Card -->
            <div class="p-6 md:p-8 border-b border-slate-100 bg-slate-50/50">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Input Rack Letters (Use '?' or '*' for Blank Tiles)</label>
                        <input type="text" id="lettersInput" placeholder="e.g., RET??A" class="w-full px-4 py-3 bg-white rounded-xl border border-slate-200 text-lg font-mono uppercase tracking-widest focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Rule Book / Reference Lexicon</label>
                        <select id="dictionarySelect" onchange="initializeDictionaryDownload()" class="w-full px-4 py-3 bg-white rounded-xl border border-slate-200 text-base focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                            <option value="scrabble">Scrabble Standard (ENABLE Master List)</option>
                            <option value="wordle">Wordle Target Words Database</option>
                        </select>
                    </div>
                </div>

                <!-- Positional Advance Filtering Modules -->
                <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6">
                    <span class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-3">Optional Placement Overlays</span>
                    <div class="grid grid-cols-3 gap-2 md:gap-4">
                        <input type="text" id="startsWith" placeholder="Starts with..." class="px-3 py-2 border border-slate-200 rounded-lg text-sm uppercase outline-none focus:border-blue-500">
                        <input type="text" id="contains" placeholder="Contains..." class="px-3 py-2 border border-slate-200 rounded-lg text-sm uppercase outline-none focus:border-blue-500">
                        <input type="text" id="endsWith" placeholder="Ends with..." class="px-3 py-2 border border-slate-200 rounded-lg text-sm uppercase outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- Core Trigger Process Form Action Button -->
                <button id="actionBtn" onclick="runUnscrambleAnalysis()" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg flex items-center justify-center gap-3 transition-all cursor-not-allowed opacity-60 text-lg">
                    <span id="btnSpinner" class="spinner hidden"></span>
                    <span id="btnText">Downloading Dictionary...</span>
                </button>
            </div>

            <!-- Dynamic Processing Report Visual Panel -->
            <div id="resultsScreen" class="p-6 md:p-8 min-h-[200px]">
                <div id="emptyState" class="text-center py-12 text-slate-400">
                    <p id="statusFeedback" class="text-lg font-medium text-slate-600">Initializing global word data array pools...</p>
                </div>
                <div id="resultsContent" class="hidden space-y-8"></div>
            </div>

        </div>
    </main>

    <!-- AD DEMARCATION SLOT (BOTTOM) -->
    <div class="w-full max-w-7xl mx-auto my-4 text-center">
        <div class="bg-slate-200 text-slate-500 py-3 text-xs tracking-wider border border-dashed border-slate-300 rounded-md">ADVERTISEMENT SLOT (BOTTOM)</div>
    </div>
    <!-- Embedded Computing Script Matrix -->
    <script>
        const dictionarySourceMap = {
            scrabble: "https://githubusercontent.com", 
            wordle: "https://githubusercontent.com" 
        };

        let loadedWordDatabase = [];
        const scrabblePointValues = { A:1, B:3, C:3, D:2, E:1, F:4, G:2, H:4, I:1, J:8, K:5, L:1, M:3, N:1, O:1, P:3, Q:10, R:1, S:1, T:1, U:1, V:4, W:4, X:8, Y:4, Z:10 };

        async function initializeDictionaryDownload() {
            const targetKey = document.getElementById('dictionarySelect').value;
            const actionBtn = document.getElementById('actionBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const statusFeedback = document.getElementById('statusFeedback');

            actionBtn.disabled = true;
            actionBtn.classList.add('opacity-60', 'cursor-not-allowed');
            btnSpinner.classList.remove('hidden');
            btnText.innerText = "Downloading Lexicon Dataset...";
            statusFeedback.innerText = "Fetching word matrices directly from global dictionary caches...";

            try {
                const response = await fetch(dictionarySourceMap[targetKey]);
                if (!response.ok) throw new Error("Network stream fetch interruption.");
                const rawText = await response.text();
                
                loadedWordDatabase = rawText.split(/\r?\n/).map(w => w.trim().toUpperCase()).filter(w => w.length > 1);
                
                actionBtn.disabled = false;
                actionBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                btnSpinner.classList.add('hidden');
                btnText.innerText = "Unscramble Letters Now";
                statusFeedback.innerText = "System online and waiting for input values.";
            } catch (err) {
                console.error(err);
                statusFeedback.innerText = "Failed to synchronize remote data dictionaries. Please reload the webpage asset tab.";
                btnText.innerText = "Network Read Error";
                btnSpinner.classList.add('hidden');
            }
        }

        function determineScrabbleScore(word) {
            return word.split('').reduce((sum, letter) => sum + (scrabblePointValues[letter] || 0), 0);
        }

        function checkRackInclusion(word, inputLetters) {
            let pool = inputLetters.split('');
            let wildcards = pool.filter(l => l === '?' || l === '*').length;
            pool = pool.filter(l => l !== '?' && l !== '*');

            for (let letter of word) {
                const foundIdx = pool.indexOf(letter);
                if (foundIdx > -1) {
                    pool.splice(foundIdx, 1);
                } else if (wildcards > 0) {
                    wildcards--;
                } else {
                    return false;
                }
            }
            return true;
        }

        function runUnscrambleAnalysis() {
            const letters = document.getElementById('lettersInput').value.toUpperCase().replace(/\s/g, '');
            const targetType = document.getElementById('dictionarySelect').value;
            const prefix = document.getElementById('startsWith').value.toUpperCase().trim();
            const interior = document.getElementById('contains').value.toUpperCase().trim();
            const suffix = document.getElementById('endsWith').value.toUpperCase().trim();

            const emptyState = document.getElementById('emptyState');
            const resultsContent = document.getElementById('resultsContent');

            if (!letters) {
                alert("Please declare alphanumeric values in input rows.");
                return;
            }

            let processingMatches = [];

            for (let word of loadedWordDatabase) {
                if (prefix && !word.startsWith(prefix)) continue;
                if (interior && !word.includes(interior)) continue;
                if (suffix && !word.endsWith(suffix)) continue;
                
                if (checkRackInclusion(word, letters)) {
                    processingMatches.push({
                        text: word,
                        length: word.length,
                        score: targetType === 'wordle' ? 0 : determineScrabbleScore(word)
                    });
                }
            }

            if (processingMatches.length === 0) {
                emptyState.innerHTML = `<p class='text-lg font-semibold text-slate-700 py-6'>Zero matches detected for input "${letters}". Try altering entries.</p>`;
                emptyState.classList.remove('hidden');
                resultsContent.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            resultsContent.innerHTML = '';
            resultsContent.classList.remove('hidden');

            let nestedBuckets = {};
            processingMatches.forEach(item => {
                if (!nestedBuckets[item.length]) nestedBuckets[item.length] = [];
                nestedBuckets[item.length].push(item);
            });

            const sortedLengths = Object.keys(nestedBuckets).sort((a,b) => b - a);

            sortedLengths.forEach(len => {
                let listings = nestedBuckets[len].sort((a,b) => b.score - a.score);
                
                let container = document.createElement('div');
                container.className = "bg-slate-50 rounded-xl p-4 md:p-6 border border-slate-200/60 shadow-sm mb-4";
                
                let headerLine = document.createElement('h3');
                headerLine.className = "text-sm font-extrabold text-slate-500 uppercase tracking-wider mb-4 border-b border-slate-200 pb-2 flex justify-between";
                headerLine.innerHTML = `<span>${len}-Letter Combos</span> <span class='text-xs font-normal text-slate-400'>${listings.length} items</span>`;
                container.appendChild(headerLine);

                let wrapperGrid = document.createElement('div');
                wrapperGrid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3";

                listings.forEach(obj => {
                    let tile = document.createElement('div');
                    tile.className = "word-tile flex items-center justify-between px-3 py-2 rounded-lg border border-yellow-400/40";
                    tile.innerHTML = `
                        <span class="font-mono font-bold text-slate-900 tracking-wider text-base md:text-lg">${obj.text}</span>
                        ${targetType !== 'wordle' ? `<span class="bg-amber-900/10 text-amber-900 font-extrabold text-xs px-2 py-0.5 rounded-md min-w-[22px] text-center">${obj.score}</span>` : ''}
                    `;
                    wrapperGrid.appendChild(tile);
                });

                container.appendChild(wrapperGrid);
                resultsContent.appendChild(container);
            });
        }

        window.onload = initializeDictionaryDownload;
    </script>
</body>
</html>
