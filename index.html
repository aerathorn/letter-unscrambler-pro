<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Unscrambler Pro | Scrabble Solver & Wordle Cheat Suite</title>
    <!-- Rock-Solid Production Stable Tailwind Engine CDN -->
    <script src="https://tailwindcss.com"></script>
    <script>
        // Inline script to prevent theme flashing on load
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        .word-tile {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .dark .word-tile {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 3px solid #2563eb;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        .dark .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 font-sans min-h-screen flex flex-col transition-colors duration-200">

    <!-- THEME TOGGLE ACTION BAR -->
    <header class="w-full max-w-4xl mx-auto px-4 pt-4 flex justify-end">
        <button id="themeToggleBtn" onclick="toggleThemeMode()" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider cursor-pointer flex items-center gap-2 transition-all">
            <span id="themeToggleText">Switch to Dark Mode</span>
        </button>
    </header>

    <!-- AD DEMARCATION SLOT (TOP) -->
    <div class="w-full max-w-7xl mx-auto my-4 text-center">
        <div class="bg-slate-200 dark:bg-slate-900 text-slate-500 dark:text-slate-400 py-3 text-xs tracking-wider border border-dashed border-slate-300 dark:border-slate-800 rounded-md">ADVERTISEMENT SLOT (TOP)</div>
    </div>

    <!-- Application Dashboard Wrapper -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800 overflow-hidden">
            
            <!-- Centered Header Panel -->
            <div class="bg-slate-900 dark:bg-slate-950 text-white p-6 md:p-8 text-center border-b border-slate-800">
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">Letter Unscrambler Pro</h1>
                <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">Elite multi-dictionary analytics engine for Scrabble, Words with Friends, and Wordle.</p>
            </div>

            <div class="p-6 md:p-8 bg-slate-50/50 dark:bg-slate-900/50">
                
                <!-- HYPER-PROMINENT CENTERED INPUT BOX -->
                <div class="max-w-2xl mx-auto text-center mb-8">
                    <label class="block text-xs font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-3">Input Rack Letters (Use '?' or '*' for Blanks)</label>
                    <input type="text" id="lettersInput" placeholder="ENTER LETTERS HERE..." class="w-full text-center px-6 py-5 bg-white dark:bg-slate-950 rounded-2xl border-2 border-slate-200 dark:border-slate-800 text-3xl md:text-4xl font-mono font-black uppercase tracking-widest text-blue-600 dark:text-blue-400 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all shadow-inner">
                </div>

                <!-- SECONDARY OPTION FIELDS GRID -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">Rule Book / Reference Lexicon</label>
                        <select id="dictionarySelect" onchange="initializeDictionaryDownload()" class="w-full px-4 py-3 bg-white dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800 text-base text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                            <option value="scrabble">Scrabble Standard (ENABLE Master List)</option>
                            <option value="wordle">Wordle Target Words Database</option>
                        </select>
                    </div>
                    <div>
                        <span class="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">Optional Placement Overlays</span>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" id="startsWith" placeholder="Starts..." class="px-2 py-3 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm text-center uppercase outline-none focus:border-blue-500 text-slate-700 dark:text-slate-300">
                            <input type="text" id="contains" placeholder="Contains..." class="px-2 py-3 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm text-center uppercase outline-none focus:border-blue-500 text-slate-700 dark:text-slate-300">
                            <input type="text" id="endsWith" placeholder="Ends..." class="px-2 py-3 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-sm text-center uppercase outline-none focus:border-blue-500 text-slate-700 dark:text-slate-300">
                        </div>
                    </div>
                </div>

                <!-- Core Action Trigger Button -->
                <button id="actionBtn" onclick="runUnscrambleAnalysis()" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg flex items-center justify-center gap-3 transition-all cursor-not-allowed opacity-60 text-lg cursor-pointer">
                    <span id="btnSpinner" class="spinner hidden"></span>
                    <span id="btnText">Downloading Dictionary...</span>
                </button>
            </div>

            <!-- Dynamic Processing Result Visual Panel -->
            <div id="resultsScreen" class="p-6 md:p-8 min-h-[200px]">
                <div id="emptyState" class="text-center py-12 text-slate-400 dark:text-slate-500">
                    <p id="statusFeedback" class="text-lg font-medium text-slate-600 dark:text-slate-400">Initializing global word data array pools...</p>
                </div>
                <div id="resultsContent" class="hidden space-y-8"></div>
            </div>

        </div>
    </main>

    <!-- AD DEMARCATION SLOT (BOTTOM) -->
    <div class="w-full max-w-7xl mx-auto my-4 text-center">
        <div class="bg-slate-200 dark:bg-slate-900 text-slate-500 dark:text-slate-400 py-3 text-xs tracking-wider border border-dashed border-slate-300 dark:border-slate-800 rounded-md">ADVERTISEMENT SLOT (BOTTOM)</div>
    </div>

    <!-- Theme Logic Manager Script -->
    <script>
        function updateToggleBtnText() {
            const btnText = document.getElementById('themeToggleText');
            if (document.documentElement.classList.contains('dark')) {
                btnText.innerText = "🌞 Light Mode";
            } else {
                btnText.innerText = "🌙 Dark Mode";
            }
        }
        function toggleThemeMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            updateToggleBtnText();
        }
        window.addEventListener('DOMContentLoaded', updateToggleBtnText);
    </script>

    <!-- Mandatory Local Data Core Script Integrations -->
    <script src="words.js"></script>
    <script src="app.js"></script>
</body>
</html>
