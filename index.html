<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Unscrambler Pro | Scrabble Solver Suite</title>
    <!-- Mirror Optimized Tailwind CSS Engine CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        .word-tile {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- ADSENSE TOP BANNER -->
    <div class="w-full max-w-7xl mx-auto my-4 text-center">
        <div class="bg-slate-200 text-slate-500 py-3 text-xs tracking-wider border border-dashed border-slate-300 rounded-md">ADVERTISEMENT SLOT (TOP)</div>
    </div>

    <!-- Application Dashboard Wrapper -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- Branding Panel -->
            <div class="bg-slate-900 text-white p-6 md:p-8 text-center">
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">Letter Unscrambler Pro</h1>
                <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">Elite multi-dictionary analytics engine for Scrabble, Words with Friends, and Wordle.</p>
            </div>

            <!-- Parameters Submission Input Interface Card -->
            <div class="p-6 md:p-8 border-b border-slate-100 bg-slate-50/50">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Input Rack Letters (Use '?' or '*' for Blanks)</label>
                        <input type="text" id="lettersInput" placeholder="e.g., RET??A" class="w-full px-4 py-3 bg-white rounded-xl border border-slate-200 text-lg font-mono uppercase tracking-widest focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Rule Book / Reference Lexicon</label>
                        <select id="dictionarySelect" onchange="initializeDictionaryDownload()" class="w-full px-4 py-3 bg-white rounded-xl border border-slate-200 text-base focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                            <option value="scrabble">Scrabble Standard (ENABLE Master List)</option>
                            <option value="wordle">Wordle Target Words Database</option>
                        </select>
                    </div>
                </div>

                <!-- Positional Advance Filtering Modules -->
                <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6">
                    <span class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-3">Optional Placement Overlays</span>
                    <div class="grid grid-cols-3 gap-2 md:gap-4">
                        <input type="text" id="startsWith" placeholder="Starts with..." class="px-3 py-2 border border-slate-200 rounded-lg text-sm uppercase outline-none focus:border-blue-500">
                        <input type="text" id="contains" placeholder="Contains..." class="px-3 py-2 border border-slate-200 rounded-lg text-sm uppercase outline-none focus:border-blue-500">
                        <input type="text" id="endsWith" placeholder="Ends with..." class="px-3 py-2 border border-slate-200 rounded-lg text-sm uppercase outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- Core Trigger Process Form Action Button -->
                <button id="actionBtn" onclick="runUnscrambleAnalysis()" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg flex items-center justify-center gap-3 transition-all cursor-not-allowed opacity-60 text-lg">
                    <span id="btnSpinner" class="spinner hidden"></span>
                    <span id="btnText">Downloading Dictionary...</span>
                </button>
            </div>

            <!-- Dynamic Processing Report Visual Panel -->
            <div id="resultsScreen" class="p-6 md:p-8 min-h-[200px]">
                <div id="emptyState" class="text-center py-12 text-slate-400">
                    <p id="statusFeedback" class="text-lg font-medium text-slate-600">Initializing word pools...</p>
                </div>
                <div id="resultsContent" class="hidden space-y-8"></div>
            </div>

        </div>
    </main>

    <!-- ADSENSE BOTTOM BANNER -->
    <div class="w-full max-w-7xl mx-auto my-4 text-center">
        <div class="bg-slate-200 text-slate-500 py-3 text-xs tracking-wider border border-dashed border-slate-300 rounded-md">ADVERTISEMENT SLOT (BOTTOM)</div>
    </div>

    <!-- STRICT ORDER MANDATORY SCRIPTS LINK -->
    <script src="words.js"></script>
    <script src="app.js"></script>
</body>
</html>
